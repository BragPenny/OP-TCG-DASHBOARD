name: OPTCG SA Market Data Update

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours - tighter while new stock is landing this week
    # Once things settle down, you can loosen this back up, e.g. '0 0 * * *' for once a day.
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab any time

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Market Data Update Script
        run: python update_catalog.py

      - name: Commit and Push Updated catalog.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated OPTCG SA catalog update" && git push)
