name: Weekly OPTCG SA Market Data Update

on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday at 00:00 UTC
  workflow_dispatch: # Allows manual triggering anytime

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Market Data Update Script
        run: python update_catalog.py

      - name: Commit and Push Updated catalog.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Weekly OPTCG SA Catalog Update" && git push)
