name: Weekly OPTCG SA Market Data Update

on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Market Data
        run: |
          python -c "
          import urllib.request, json
          try:
              fx_res = urllib.request.urlopen('https://open.er-api.com/v6/latest/USD').read()
              usd_zar = json.loads(fx_res)['rates']['ZAR']
          except Exception:
              usd_zar = 18.50
          print(f'Current Exchange Rate: 1 USD = {usd_zar} ZAR')
          "

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Weekly OPTCG SA Catalog Update" && git push)
